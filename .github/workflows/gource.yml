name: Gource visualization

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gource
        uses: nbprojekt/gource-action@v1
        with:
          gource_resolution: 1080p
          gource_fps: 60
          gource_filename_time: 3
          gource_hide_items: 'mouse,date,filenames'
          gource_title: pwnspeaker

      - name: Install ffmpeg (runner)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Upscale + re-encode
        run: |
          ffmpeg -y -i ./gource/gource.mp4 \
            -c:v libx264 -crf 19 -level 3.1 -preset slow -tune film \
            -filter:v "scale=-1:720" -sws_flags lanczos \
            -c:a aac -b:a 128k \
            ./gource.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-gource
          path: ./gource.mp4

      - name: Commit gource video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource.mp4 || true
          git diff --staged --quiet || git commit -m "ci: update gource visualization (automated)"
          git push
